# Tudo isolado em Docker. DB sem ports; web publicado só em loopback (Nginx do host faz o TLS).
x-app-env: &app-env
  NODE_ENV: production
  TZ: America/Manaus
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DEMO_MODE: "true"
  # Chave geral da sincronização com o K3G CRM (ligada por ordem do dono em 2026-10-23). Sozinha NÃO importa nada:
  # cada empresa precisa estar no modo CRM, com a conexão ativada, e a diretoria confirmar a prévia.
  CRM_SYNC_ENABLED: "true"
  AUTH_TRUST_HOST: "true"
  AUTH_URL: "https://financeiro.devops.k3gsolutions.com.br"
  BILLING_LIVE_ENABLED: "false"
  EMAIL_EXTERNAL_ENABLED: "false"
  CORA_LIVE_ENABLED: "false"
  # Cora de TESTES (stage): permite que uma empresa escolha "Cora — testes (homologação)" como provedor de boleto (diretoria, auditado). Não existe produção.
  CORA_STAGE_ENABLED: "true"
  FISCAL_LIVE_ENABLED: "false"
  WHATSAPP_LIVE_ENABLED: "false"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: k3gfinance
      TZ: UTC
    volumes:
      - k3g_finance_pgdata:/var/lib/postgresql/data
    networks: [k3g_finance]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d k3gfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file:
      - .env
      - .env.auth
      - path: .env.crm   # opcional: CRM_BASE_URL e CRM_API_TOKEN (somente leitura)
        required: false
      - path: .env.credentials   # opcional: K3G_CREDENTIALS_KEY (chave que cifra as credenciais guardadas em Integrações); sem ela usa AUTH_SECRET
        required: false
    environment: *app-env
    ports:
      - "127.0.0.1:3150:3150"
    depends_on:
      db: { condition: service_healthy }
    networks: [k3g_finance]
    mem_limit: 768m

  # Agendador da fila de mensagens (E09). Só age em empresas com "envio automático" ligado em Mensagens → Configuração.
  # Provedores SIMULADOS: nada é enviado. Usa a imagem "tools" (código embutido): rebuild a cada deploy → docker compose build scheduler.
  scheduler:
    build: { context: ., target: tools }
    restart: unless-stopped
    command: ["pnpm", "exec", "tsx", "scripts/scheduler.ts"]
    env_file:
      - .env
      - .env.auth
      - path: .env.crm
        required: false
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [k3g_finance]
    mem_limit: 256m

  # docker compose --profile tools run --rm tools pnpm db:migrate | seed | test
  tools:
    profiles: [tools]
    build: { context: ., target: tools }
    env_file:
      - .env
      - .env.auth
      - path: .env.crm   # opcional: CRM_BASE_URL e CRM_API_TOKEN (somente leitura)
        required: false
      - path: .env.credentials   # opcional: mesma chave do web, para os scripts de operação (ex.: sonda da Cora) abrirem as credenciais cifradas
        required: false
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [k3g_finance]

volumes:
  k3g_finance_pgdata:
networks:
  k3g_finance:
