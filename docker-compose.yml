# Tudo isolado em Docker. DB sem ports; web publicado só em loopback (Nginx do host faz o TLS).
x-app-env: &app-env
  NODE_ENV: production
  TZ: America/Manaus
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DEMO_MODE: "true"
  # Chave geral da sincronização com o K3G CRM (ligada por ordem do dono em 2026-10-23). Sozinha NÃO importa nada:
  # cada empresa precisa estar no modo CRM, com a conexão ativada, e a diretoria confirmar a prévia.
  CRM_SYNC_ENABLED: "true"
  AUTH_TRUST_HOST: "true"
  AUTH_URL: "https://financeiro.devops.k3gsolutions.com.br"
  BILLING_LIVE_ENABLED: "false"
  EMAIL_EXTERNAL_ENABLED: "true"   # LIGADA em 2026-10-29 (canário E33, ordem do dono; autorização registrada só na empresa K3G TESTE, 2 destinatários internos, 5/dia). Sem autorização ativa + conta + lista, nada sai. Kill switch: "false" + restart de web e scheduler.
  CORA_LIVE_ENABLED: "false"
  # Cora de TESTES (stage): permite que uma empresa escolha "Cora — testes (homologação)" como provedor de boleto (diretoria, auditado). Não existe produção.
  CORA_STAGE_ENABLED: "true"
  # E10b-6 — EMISSÃO REAL na Cora de PRODUÇÃO. LIGADA em 2026-10-28 por ordem do dono ("Ligue a chave"). Ligada, nenhuma empresa emite: cada uma precisa ser "armada" pela diretoria (frase digitada) na tela de Emissões, em modo canário (3/dia), com confirmação a cada rodada. Kill switch: voltar para "false" + restart de web e scheduler (ou CORA_LIVE_ENABLED="true" = emergência geral).
  CORA_PROD_EMISSION_ENABLED: "true"
  FISCAL_LIVE_ENABLED: "false"
  WHATSAPP_LIVE_ENABLED: "false"   # chave GERAL antiga da fila simulada: continua desligada (ligada, recusa TODA emissão real)
  # W1 — WhatsApp (WAHA, NÃO oficial). MODULE = gerenciar conexões/QR (não envia nada). SEND = envio manual de TESTE (desligada: liga só por ordem do dono, com autorização registrada na tela).
  # AUTOMATION = régua automática (W4: chave do servidor LIGADA em 2026-10-30; cada empresa/régua ainda precisa ser ligada pela diretoria na tela).
  WAHA_BASE_INTERNAL_URL: "http://waha:3000"
  WHATSAPP_MODULE_ENABLED: "true"
  WHATSAPP_SEND_ENABLED: "true"   # LIGADA em 2026-10-29 por ordem do dono (canário W1). Sozinha não envia nada: cada empresa precisa de autorização ativa (números exatos + limite), conexão liberada e conectada, janela e limites; só envio manual de teste.
  WHATSAPP_AUTOMATION_ENABLED: "true"   # LIGADA em 2026-10-30 por ordem do dono. Sozinha não envia nada: cada empresa precisa ser armada pela diretoria na tela (frase + referência) e ter ao menos uma régua marcada. Para desligar: voltar a "false" + docker compose up -d web scheduler.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: k3gfinance
      TZ: UTC
    volumes:
      - k3g_finance_pgdata:/var/lib/postgresql/data
    networks: [k3g_finance]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d k3gfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file:
      - .env
      - .env.auth
      - path: .env.crm   # opcional: CRM_BASE_URL e CRM_API_TOKEN (somente leitura)
        required: false
      - path: .env.credentials   # opcional: K3G_CREDENTIALS_KEY (chave que cifra as credenciais guardadas em Integrações); sem ela usa AUTH_SECRET
        required: false
      - path: .env.waha   # W1: WAHA_API_KEY (só servidor; o navegador nunca recebe)
        required: false
    environment: *app-env
    ports:
      - "127.0.0.1:3150:3150"
    depends_on:
      db: { condition: service_healthy }
    networks: [k3g_finance]
    mem_limit: 768m

  # Agendador da fila de mensagens (E09). Só age em empresas com "envio automático" ligado em Mensagens → Configuração.
  # Provedores SIMULADOS: nada é enviado. Usa a imagem "tools" (código embutido): rebuild a cada deploy → docker compose build scheduler.
  scheduler:
    build: { context: ., target: tools }
    restart: unless-stopped
    command: ["pnpm", "exec", "tsx", "scripts/scheduler.ts"]
    env_file:
      - .env
      - .env.auth
      - path: .env.crm
        required: false
      - path: .env.credentials   # E10b-4/5: o agendador consulta a Cora (baixa automática e avisos) e precisa abrir as credenciais cifradas
        required: false
      - path: .env.waha   # W1: WAHA_API_KEY (só servidor; o navegador nunca recebe)
        required: false
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [k3g_finance]
    mem_limit: 256m

  # W1 — WhatsApp (WAHA CORE, engine GOWS; NÃO oficial). Imagem FIXADA por digest (nunca latest). SEM porta publicada: só web/scheduler/tools da rede k3g_finance a alcançam, e só com a chave.
  # Precisa de SAÍDA para a internet (servidores do WhatsApp), por isso fica na rede normal, não numa rede "internal". Painel e Swagger desligados.
  # Sobe SÓ por pedido: `docker compose --profile whatsapp up -d waha`. Em perfil à parte de propósito: sem o arquivo .env.waha (chave) ele nem é lido, e a falta do arquivo não derruba web/scheduler;
  # e a WAHA nunca sobe sem chave (com env_file obrigatório ela simplesmente não inicia).
  waha:
    profiles: [whatsapp]
    image: devlikeapro/waha:gows-2026.8.2@sha256:23f2d002d262b54c711af02b5fe79b1948bbf31e6b64cf7776cd6bd2f7477b47
    restart: unless-stopped
    env_file: [.env.waha]
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      # W3b — a WAHA avisa o NOSSO receptor (rede interna k3g_finance; assinatura HMAC-SHA512 com WHATSAPP_HOOK_HMAC_KEY, que fica em .env.waha junto da chave da API).
      WHATSAPP_HOOK_URL: "http://web:3150/api/v1/webhooks/waha"
      WHATSAPP_HOOK_EVENTS: "message,message.ack,session.status"
      TZ: America/Manaus
    expose: ["3000"]
    volumes:
      - waha_sessions:/app/.sessions
    networks: [k3g_finance]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ping >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # docker compose --profile tools run --rm tools pnpm db:migrate | seed | test
  tools:
    profiles: [tools]
    build: { context: ., target: tools }
    env_file:
      - .env
      - .env.auth
      - path: .env.crm   # opcional: CRM_BASE_URL e CRM_API_TOKEN (somente leitura)
        required: false
      - path: .env.credentials   # opcional: mesma chave do web, para os scripts de operação (ex.: sonda da Cora) abrirem as credenciais cifradas
        required: false
      - path: .env.waha   # W1: WAHA_API_KEY (só servidor; o navegador nunca recebe)
        required: false
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    networks: [k3g_finance]

volumes:
  k3g_finance_pgdata:
  waha_sessions:
networks:
  k3g_finance:
