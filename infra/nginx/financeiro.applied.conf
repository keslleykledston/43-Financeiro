server {
    listen 80;
    listen [::]:80;
    server_name financeiro.devops.k3gsolutions.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name financeiro.devops.k3gsolutions.com.br;

    ssl_certificate /etc/letsencrypt/live/financeiro.devops.k3gsolutions.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/financeiro.devops.k3gsolutions.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/financeiro.access.log;
    error_log /var/log/nginx/financeiro.error.log;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # HSTS e CSP: ativar depois de validar impacto (ver docs/DEPLOY.md).

    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
