# SANDBOX de validação: stack descartável e isolada (projeto Compose próprio, DB em tmpfs, sem ports,
# credenciais fictícias). Não compartilha rede, volume nem banco com produção. Uso: `pnpm sandbox`.
name: k3g-sandbox

x-env: &env
  NODE_ENV: production
  TZ: America/Manaus
  POSTGRES_USER: sandbox
  POSTGRES_PASSWORD: sandbox-only-not-a-secret
  POSTGRES_HOST: sandbox-db
  POSTGRES_PORT: "5432"
  AUTH_SECRET: sandbox-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
  AUTH_TRUST_HOST: "true"
  AUTH_URL: http://sandbox-web:3150
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: c2FuZGJveC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISE=
  DEMO_MODE: "true"
  BILLING_LIVE_ENABLED: "false"
  EMAIL_EXTERNAL_ENABLED: "false"
  CORA_LIVE_ENABLED: "false"
  FISCAL_LIVE_ENABLED: "false"
  SEED_ADMIN_EMAIL: admin@sandbox.test
  SEED_ADMIN_PASSWORD: Sandbox-Admin-Pass-123

services:
  sandbox-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: sandbox, POSTGRES_PASSWORD: sandbox-only-not-a-secret, POSTGRES_DB: k3gfinance, TZ: UTC }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sandbox -d k3gfinance"], interval: 3s, timeout: 3s, retries: 20 }

  sandbox-tools:
    build: { context: ., target: tools }
    environment: *env
    depends_on: { sandbox-db: { condition: service_healthy } }

  sandbox-web:
    build: { context: ., target: runner }
    environment: *env
    depends_on: { sandbox-db: { condition: service_healthy } }

  sandbox-e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /work
    ipc: host
    volumes: ["./:/work"]
    environment:
      BASE_URL: http://sandbox-web:3150
      SANDBOX_ADMIN_EMAIL: admin@sandbox.test
      SANDBOX_ADMIN_PASSWORD: Sandbox-Admin-Pass-123
      CI: "1"
    depends_on: { sandbox-web: { condition: service_healthy } }
    command: ["sh", "-c", "npx playwright test; rc=$$?; chown -R 1000:1000 e2e-results 2>/dev/null; exit $$rc"]
